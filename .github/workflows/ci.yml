name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Run every seed this branch adds or changes against main, as the runner does
        run: |
          git fetch --no-tags https://github.com/PerkyZZ999/EmVB.git main:refs/remotes/up/main
          git show up/main:scripts/seeded-bugs.json > /tmp/base.json
          python3 - <<'EOF' > /tmp/ids.txt
          import json
          base={s['id']:json.dumps(s,sort_keys=True) for s in json.load(open('/tmp/base.json'))['seeds']}
          for s in json.load(open('scripts/seeded-bugs.json'))['seeds']:
              if s['id'] not in base or json.dumps(s,sort_keys=True)!=base[s['id']]:
                  print(s['id'])
          EOF
          echo "seeds to run: $(wc -l < /tmp/ids.txt)"
          failed=0
          while read -r id; do
            echo "::group::$id"
            if bun scripts/seeded-bug.ts --kind unit --only "$id" --jobs 1; then echo "CAUGHT $id"; else echo "NOT CAUGHT $id"; failed=1; fi
            git status --short | grep -v '^??' && { echo "tree left dirty after $id"; failed=1; git checkout -- .; }
            echo "::endgroup::"
          done < /tmp/ids.txt
          exit $failed
